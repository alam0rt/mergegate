# .mergegate.yaml for a Flux GitOps repo. Commit it to the default branch:
# the gate always reads it from the PR's base branch, not the PR itself.

# Flux upgrading itself rewrites gotk-components.yaml. The diffs are usually
# pure version bumps, but a bad one takes down reconciliation for the whole
# cluster, so a human looks.
protected_paths:
  - "clusters/*/flux-system/**"

# Only the image-automation bot may auto-merge.
allowed_authors:
  - "app/github-actions"
  - "github-actions[bot]"

# Repo-specific questions for Jev. "Yes" means a human should look. A watch
# can only send a PR to review, never approve one. Examples:
# watch:
#   - id: headscale
#     question: "Does this diff change the headscale container image or its version?"
#     paths: ["clusters/**"]
#     threshold: 0.5
#   - id: ingress_snippets
#     question: "Does this diff add or enable nginx configuration-snippet or server-snippet annotations?"
